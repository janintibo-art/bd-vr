name: Build Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_HOME: /usr/lib/android-sdk

jobs:
  build:
    name: Quest 3 APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android 36 and Godot
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "cmdline-tools;latest"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF_SETTINGS
          java -version
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME/build-tools/36.1.0"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Build debug APK for Quest 3
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Quest 3" build/bd-vr.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bd-vr-quest3-v3
          path: build/bd-vr.apk
          if-no-files-found: error
